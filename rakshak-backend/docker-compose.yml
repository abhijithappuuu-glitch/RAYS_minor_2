version: '3.8'

services:
  api:
    build: .
    container_name: rakshak-api
    ports:
      - "8000:8000"
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY}
      - VALID_API_KEYS=${VALID_API_KEYS}
      - REDIS_URL=redis://redis:6379
      - LOG_LEVEL=INFO
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - rakshak-network

  redis:
    image: redis:7-alpine
    container_name: rakshak-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - rakshak-network

networks:
  rakshak-network:
    driver: bridge

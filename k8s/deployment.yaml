apiVersion: v1
kind: Namespace
metadata:
  name: rays
  labels:
    name: rays

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rays-config
  namespace: rays
data:
  FLASK_ENV: production
  LOG_LEVEL: INFO
  LOG_FORMAT: json
  RATELIMIT_ENABLED: "True"
  RATELIMIT_DEFAULT: "100 per hour"
  RATELIMIT_PREDICT: "30 per minute"
  MODEL_VERSION: "3.0.0"

---
apiVersion: v1
kind: Secret
metadata:
  name: rays-secrets
  namespace: rays
type: Opaque
stringData:
  SECRET_KEY: "your-production-secret-key-min-32-chars"
  VALID_API_KEYS: "api-key-1,api-key-2,api-key-3"
  DATABASE_URL: "postgresql://user:password@postgres-service:5432/rays_db"
  REDIS_URL: "redis://redis-service:6379/0"

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: rays
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: standard

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: rays
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          value: rays
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: rays-secrets
              key: POSTGRES_PASSWORD
        - name: POSTGRES_DB
          value: rays_db
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: postgres-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: rays
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
  type: ClusterIP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: rays
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"

---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: rays
spec:
  selector:
    app: redis
  ports:
  - port: 6379
    targetPort: 6379
  type: ClusterIP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rays-api
  namespace: rays
  labels:
    app: rays-api
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  selector:
    matchLabels:
      app: rays-api
  template:
    metadata:
      labels:
        app: rays-api
    spec:
      serviceAccountName: rays-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: rays-api
        image: ghcr.io/your-org/rays/backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
        envFrom:
        - configMapRef:
            name: rays-config
        - secretRef:
            name: rays-secrets
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/v1/ready
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - rays-api
              topologyKey: kubernetes.io/hostname

---
apiVersion: v1
kind: Service
metadata:
  name: rays-api-service
  namespace: rays
  labels:
    app: rays-api
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: rays-api

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: rays-api-hpa
  namespace: rays
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: rays-api
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: rays-api-pdb
  namespace: rays
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: rays-api

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ServiceAccount
metadata:
  name: rays-api
  namespace: rays

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rays-api-role
  namespace: rays
rules:
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rays-api-rolebinding
  namespace: rays
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rays-api-role
subjects:
- kind: ServiceAccount
  name: rays-api
  namespace: rays
